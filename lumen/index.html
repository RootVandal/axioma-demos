<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen — ювелирный бренд (3D-демо)</title>
<meta name="description" content="Демо 3D-сайта ювелирного бренда, созданный студией Axioma.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Manrope:wght@300;500&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
  *{box-sizing:border-box;margin:0}
  body{background:#07070a;color:#efe9df;font:300 17px/1.6 Manrope,system-ui,sans-serif}
  a{color:inherit}
  #gem{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  header,section,footer{position:relative;z-index:1}
  header{display:flex;justify-content:space-between;align-items:center;height:76px;padding:0 28px;letter-spacing:.3em;font-size:13px;text-transform:uppercase}
  .hero{min-height:calc(100vh - 76px);display:flex;flex-direction:column;justify-content:flex-end;padding:0 28px 9vh}
  h1{font:300 clamp(48px,9vw,120px)/.95 "Cormorant Garamond",serif;letter-spacing:-.01em}
  h1 em{color:#d8b77a}
  .lead{max-width:420px;margin-top:20px;opacity:.75}
  section.col{background:linear-gradient(transparent,#07070a 18%);padding:16vh 28px 80px}
  h2{font:300 clamp(34px,5vw,60px)/1 "Cormorant Garamond",serif;margin-bottom:36px}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:1100px}
  .card{border:1px solid rgba(239,233,223,.16);padding:26px;border-radius:2px;background:rgba(7,7,10,.6);backdrop-filter:blur(6px)}
  .card i{display:block;height:120px;margin-bottom:18px;background:radial-gradient(circle at 50% 60%,var(--c) 0 16%,transparent 17%),radial-gradient(circle at 50% 60%,rgba(255,255,255,.08) 0 34%,transparent 35%)}
  .card b{font:300 26px "Cormorant Garamond",serif;display:block}
  .card span{opacity:.6;font-size:15px}
  footer{padding:40px 28px 56px;font-size:13px;opacity:.6}
  .hint{position:fixed;right:28px;bottom:24px;z-index:1;font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.5}
  @media (max-width:820px){.cards{grid-template-columns:1fr}.hint{display:none}}
</style>
</head>
<body>
<canvas id="gem" aria-hidden="true"></canvas>
<header><span>Lumen</span><span>Коллекция 2026</span></header>
<div class="hero">
  <h1>Свет, который<br>можно <em>носить</em></h1>
  <p class="lead">Камни огранки «бриллиант» в оправе из золота. Каждое изделие собирается вручную.</p>
</div>
<section class="col">
  <h2>Коллекция</h2>
  <div class="cards">
    <div class="card" style="--c:#d8b77a"><i></i><b>Aurum</b><span>Кольцо, золото 585</span></div>
    <div class="card" style="--c:#b8c7d9"><i></i><b>Glacier</b><span>Серьги, белое золото</span></div>
    <div class="card" style="--c:#c97a8a"><i></i><b>Rosa</b><span>Подвеска, розовое золото</span></div>
  </div>
</section>
<footer>Демо-сайт, созданный студией <a href="https://axioma.codes">Axioma</a>. Бренд Lumen вымышлен.</footer>
<div class="hint">Двигайте курсор</div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const canvas = document.getElementById('gem');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), .04).texture;
const camera = new THREE.PerspectiveCamera(32, 1, .1, 100);
camera.position.set(0, 0, 9);
// a brilliant cut: a crown and a pavilion around a flat table
const pts = [new THREE.Vector2(0, 1.0), new THREE.Vector2(.62, 1.0), new THREE.Vector2(1.18, .55), new THREE.Vector2(1.2, .42), new THREE.Vector2(0, -1.5)];
const geo = new THREE.LatheGeometry(pts, 16).toNonIndexed(); geo.computeVertexNormals();
const gem = new THREE.Mesh(geo, new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0, roughness: 0, transmission: 1, thickness: 1.6, ior: 2.4, dispersion: 4, flatShading: true, envMapIntensity: 1.6 }));
scene.add(gem);
const ring = new THREE.Mesh(new THREE.TorusGeometry(1.75, .1, 24, 120), new THREE.MeshStandardMaterial({ color: 0xd8b77a, metalness: 1, roughness: .2 }));
ring.rotation.x = Math.PI / 2.4; scene.add(ring);
let mx = 0, my = 0;
addEventListener('pointermove', e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; }, { passive: true });
const fit = () => {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  gem.position.x = ring.position.x = innerWidth > 820 ? 1.8 : 0;
  gem.position.y = ring.position.y = innerWidth > 820 ? .3 : 1.1;
};
fit(); addEventListener('resize', fit);
renderer.setAnimationLoop(t => {
  t /= 1000;
  const s = scrollY / innerHeight;
  gem.rotation.y = t * .35 + mx * 1.2 + s * 2;
  gem.rotation.x = .3 + my * .6;
  ring.rotation.z = t * .2;
  canvas.style.opacity = Math.max(.15, 1 - s * .9);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
